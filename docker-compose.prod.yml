services:
  # 1. Veritabanı
  postgres:
    image: postgres:16
    container_name: bahce_db_prod
    environment:
      POSTGRES_DB: bahce
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD} # Güvenlik için .env dosyasından okuyacak
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    networks:
      - app-network

  # 2. Backend (Spring Boot)
  backend:
    build: ./backend
    container_name: bahce_backend_prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bahce
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET}
      # CORS ayarı: Frontend domainine izin ver
      APP_CORS_ALLOWED_ORIGINS: http://${DOMAIN_NAME},https://${DOMAIN_NAME}
    depends_on:
      - postgres
    networks:
      - app-network

  # 3. Frontend (React)
  frontend:
    build:
      context: ./frontend/ui
      args:
        # Frontend, Backend'e Nginx (Reverse Proxy) üzerinden ulaşacak
        VITE_API_URL: https://${DOMAIN_NAME}/api
    container_name: bahce_frontend_prod
    depends_on:
      - backend
    networks:
      - app-network

  # 4. Nginx (Ana Kapı / Reverse Proxy)
  nginx-proxy:
    image: nginx:alpine
    container_name: bahce_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf
      # SSL sertifikaları için (Certbot ile alınacak)
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  pg_data_prod:

networks:
  app-network:
    driver: bridge