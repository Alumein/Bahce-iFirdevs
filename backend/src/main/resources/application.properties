spring.application.name=v0.1
# ===================== Server =====================
server.port=8080

# ===================== PostgreSQL =================
spring.datasource.url=jdbc:postgresql://localhost:5432/bahce
spring.datasource.username=bahce
spring.datasource.password=bahce
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===================== Redis (Cache) ==============
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# İsteğe bağlı: cache TTL (ms). Örn: 10 dk
# spring.cache.redis.time-to-live=600000

# ===================== RabbitMQ ===================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=bahce
spring.rabbitmq.password=bahce

# ===================== MinIO (S3-compatible) ======
# Uygulamada bu key'lerle bir MinioClient bean'i oluşturacağız.
app.storage.minio.endpoint=http://localhost:9000
app.storage.minio.access-key=bahce
app.storage.minio.secret-key=bahcebahce
app.storage.minio.bucket=product-images
app.storage.minio.secure=false

# ===================== Actuator ===================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===================== OpenAPI / Swagger ==========
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# ===================== Upload (opsiyonel) =========
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT
app.jwt.secret=CHANGE_ME_TO_64+_CHAR_RANDOM_SECRET________________________________
app.jwt.ttl-ms=604800000


# Geçici Basic Auth kullanıcısı
spring.security.user.name=admin
spring.security.user.password={noop}pass123
spring.security.user.roles=ADMIN
